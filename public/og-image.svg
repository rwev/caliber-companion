<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#111111"/>
  <text x="100" y="240" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#e8e8e8">Caliber</text>
  <text x="100" y="320" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#eb6b34">Companion</text>
  <text x="100" y="380" font-family="monospace" font-size="22" fill="#999999">Ballistic data, cartridge specs, and comparison tools for 102 calibers</text>
  <text x="100" y="430" font-family="monospace" font-size="16" fill="#666666">102 calibers  ·  617 load profiles  ·  100+ firearms  ·  9 calculators</text>
  <!-- Simplified cartridge silhouettes -->
  <g transform="translate(750, 520) scale(1, -1)" stroke="#eb6b34" stroke-width="1.5" fill="#eb6b34" fill-opacity="0.08">
    <!-- .22 LR silhouette -->
    <g transform="translate(0, 0)">
      <rect x="-6" y="0" width="12" height="35" rx="1"/>
      <ellipse cx="0" cy="50" rx="5" ry="15"/>
    </g>
    <!-- 9mm silhouette -->
    <g transform="translate(60, 0)">
      <rect x="-8" y="0" width="16" height="45" rx="1"/>
      <ellipse cx="0" cy="60" rx="7" ry="15"/>
    </g>
    <!-- 5.56 silhouette -->
    <g transform="translate(140, 0)">
      <path d="M-12,0 L-12,65 L-6,85 L-6,95 L-5,95 L-5,120 L0,140 L5,120 L5,95 L6,95 L6,85 L12,65 L12,0 Z"/>
    </g>
    <!-- .308 silhouette -->
    <g transform="translate(240, 0)">
      <path d="M-15,0 L-15,85 L-8,110 L-8,125 L-7,125 L-7,155 L0,180 L7,155 L7,125 L8,125 L8,110 L15,85 L15,0 Z"/>
    </g>
    <!-- .50 BMG silhouette -->
    <g transform="translate(370, 0)">
      <path d="M-22,0 L-22,160 L-14,210 L-14,235 L-12,235 L-12,280 L0,330 L12,280 L12,235 L14,235 L14,210 L22,160 L22,0 Z"/>
    </g>
  </g>
  <!-- Labels -->
  <g font-family="monospace" font-size="11" fill="#666666" text-anchor="middle">
    <text x="750" y="560">.22 LR</text>
    <text x="810" y="560">9mm</text>
    <text x="890" y="560">5.56</text>
    <text x="990" y="560">.308</text>
    <text x="1120" y="560">.50 BMG</text>
  </g>
</svg>
